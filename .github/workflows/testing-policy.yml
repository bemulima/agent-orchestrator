name: Testing Policy Canary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Testing Policy tier
        type: choice
        required: true
        default: verify:pr
        options:
          - verify:pr
          - verify:main
          - verify:nightly
          - verify:release
      base_sha:
        description: Full base SHA required for manually dispatched PR or main tiers
        type: string
        required: false

permissions:
  contents: read

jobs:
  testing-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: course-dev-orchestrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: course-dev-orchestrator
          fetch-depth: 0
          persist-credentials: false

      - name: Set up policy Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Capture policy Node executable
        id: policy_node
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: course-dev-orchestrator/go.mod
          cache: true

      - name: Set up owner Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            course-dev-orchestrator/runner/package-lock.json
            course-dev-orchestrator/web/package-lock.json

      - name: Install runner dependencies
        run: npm ci --prefix runner

      - name: Install UI dependencies
        run: npm ci --prefix web

      - name: Start disposable PostgreSQL for dependency-backed policy checks
        run: docker compose up -d --wait postgres

      - name: Check frozen policy bundle identity
        env:
          POLICY_NODE: ${{ steps.policy_node.outputs.path }}
        run: |
          "$POLICY_NODE" <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('.ai/testing/policy/policy-lock.json', 'utf8'));
          const expected = {
            policy_source_commit: 'f8317b889892b35e9de6bd4e46bb1c20a15e6a88',
            policy_semantics_sha: '5a0422683ae97659d8f152df5a2b60d45d1893f9',
            bundle_sha256: 'b7a87cfbe229cee71379c9775bd36af0fb1f0a6da9c31b4d706a9fcdf3c5ea43',
            node_runtime_requirement: '>=20 <21',
          };
          if (Number(process.versions.node.split('.')[0]) !== 20) {
            throw new Error(`Policy runner requires Node 20; got ${process.versions.node}`);
          }
          for (const [key, value] of Object.entries(expected)) {
            if (lock[key] !== value) throw new Error(`Policy lock identity mismatch: ${key}`);
          }
          const actual = createHash('sha256')
            .update(readFileSync('.ai/testing/policy/policy-runner.cjs'))
            .digest('hex');
          if (actual !== lock.bundle_sha256) throw new Error('Policy bundle checksum mismatch');
          console.log(`Policy bundle checksum PASS sha256=${actual}`);
          NODE
          "$POLICY_NODE" .ai/testing/policy/policy-runner.cjs --version
          "$POLICY_NODE" .ai/testing/policy/policy-runner.cjs verify-lock --lock .ai/testing/policy/policy-lock.json

      - name: Validate repository manifest
        env:
          POLICY_NODE: ${{ steps.policy_node.outputs.path }}
        run: |
          "$POLICY_NODE" .ai/testing/policy/policy-runner.cjs validate --repo .

      - name: Run selected Testing Policy tier
        id: policy_run
        continue-on-error: true
        env:
          POLICY_NODE: ${{ steps.policy_node.outputs.path }}
          POLICY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          POLICY_HEAD_SHA: ${{ github.sha }}
          POLICY_TIER_COMMAND: ${{ github.event_name == 'schedule' && 'verify:nightly' || github.event_name == 'pull_request' && 'verify:pr' || github.event_name == 'push' && 'verify:main' || inputs.command || 'verify:pr' }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$POLICY_NODE" .ai/testing/policy/policy-runner.cjs verify
            --repo . --command "$POLICY_TIER_COMMAND" --output-dir .
            --run-id "$POLICY_RUN_ID" --head "$POLICY_HEAD_SHA")
          if [[ "$POLICY_TIER_COMMAND" == verify:pr || "$POLICY_TIER_COMMAND" == verify:main ]]; then
            if [[ -n "$POLICY_BASE_SHA" ]]; then
              args+=(--base "$POLICY_BASE_SHA")
            fi
          fi
          "${args[@]}"

      - name: Validate test-result.v1 artifacts
        id: validate_results
        if: always()
        continue-on-error: true
        shell: bash
        env:
          POLICY_NODE: ${{ steps.policy_node.outputs.path }}
        run: |
          set -euo pipefail
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory was produced.' >&2
            exit 1
          fi
          mapfile -d '' result_files < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#result_files[@]} == 0)); then
            echo 'No test-result.v1.json files were produced.' >&2
            exit 1
          fi
          for result in "${result_files[@]}"; do
            "$POLICY_NODE" .ai/testing/policy/policy-runner.cjs validate-result --repo . --result "$result"
          done

      - name: Upload testing-policy-results artifact
        id: upload_results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testing-policy-results
          path: course-dev-orchestrator/test-results/**/test-result.v1.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce policy result after artifact upload
        if: always()
        env:
          POLICY_NODE: ${{ steps.policy_node.outputs.path }}
          POLICY_OUTCOME: ${{ steps.policy_run.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_results.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_results.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_OUTCOME" != success ]]; then
            echo "Result validation did not succeed: $VALIDATION_OUTCOME" >&2
            exit 1
          fi
          if [[ "$UPLOAD_OUTCOME" != success ]]; then
            echo "Required result artifact upload did not succeed: $UPLOAD_OUTCOME" >&2
            exit 1
          fi
          mapfile -d '' result_files < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#result_files[@]} == 0)); then
            echo 'No test-result.v1.json files are available for final enforcement.' >&2
            exit 1
          fi
          for result in "${result_files[@]}"; do
            "$POLICY_NODE" .ai/testing/policy/policy-runner.cjs enforce-result --repo . --result "$result"
          done
          if [[ "$POLICY_OUTCOME" != success ]]; then
            echo "Policy runner command did not succeed: $POLICY_OUTCOME" >&2
            exit 1
          fi

      - name: Remove disposable PostgreSQL service
        if: always()
        run: docker compose down --volumes --remove-orphans
