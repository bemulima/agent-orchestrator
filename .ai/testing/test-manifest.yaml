schema_version: test-manifest.v1
manifest_version: 1.0.0
policy_version: testing-policy.v1

repository:
  id: course-dev-orchestrator
  profile: ARCHITECTURE_ORCHESTRATOR
  stack:
    language: Go, TypeScript
    runtime:
      name: Go and Node.js
      version: "go.mod; Node.js 22 (CI)"

suites:
  unit.domain:
    applicability: APPLICABLE
    implementation: PRESENT
    commands: [test:unit]
  application.usecase:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The orchestrator owns workflow control-plane operations, not learning-platform product use cases.
  persistence.repository:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The architecture orchestrator does not own service business repositories.
  transport.http:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Its control-plane HTTP API is outside the ARCHITECTURE_ORCHESTRATOR taxonomy profile.
  authorization:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Product authorization decisions remain service-owned.
  integration.hermetic:
    applicability: APPLICABLE
    implementation: PRESENT
    commands: [test:unit]
  integration.dependency:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:integration:deps]
    exception_id: CDO-DEPENDENCY-INTEGRATION
  migration.lifecycle:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Database migration ownership is outside the architecture orchestrator test profile.
  event.producer:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The architecture orchestrator is not a business event producer.
  event.consumer:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The architecture orchestrator is not a business event consumer.
  contract.provider:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Service provider contract conformance is outside the ARCHITECTURE_ORCHESTRATOR taxonomy profile.
  contract.consumer:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Service consumer contract conformance is outside the ARCHITECTURE_ORCHESTRATOR taxonomy profile.
  architecture.local:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:architecture]
    exception_id: CDO-LOCAL-ARCHITECTURE
  quality.static:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [check:format, check:lint, check:types]
    exception_id: CDO-STATIC-QUALITY
  coverage:
    applicability: APPLICABLE
    implementation: MISSING
    commands: [coverage]
    exception_id: CDO-COVERAGE
  mutation:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Mutation testing is reserved and outside the ARCHITECTURE_ORCHESTRATOR profile.
  frontend.hook:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The owner UI does not make this repository a frontend application under the frozen profile taxonomy.
  frontend.store:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The owner UI is architecture-control-plane tooling, not a frontend product state-store profile.
  frontend.api_client:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The owner UI client is not a frontend product API client under the frozen profile taxonomy.
  frontend.component:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Owner UI components are tested through the platform architecture and repository UI checks, not a frontend product profile.
  frontend.component_integration:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: The repository is classified as an architecture orchestrator, not a frontend application.
  frontend.accessibility:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Frontend accessibility behavior is outside this frozen profile's owned taxonomy.
  frontend.browser_e2e:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Frontend browser E2E is outside the ARCHITECTURE_ORCHESTRATOR profile.
  platform.business_acceptance:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Cross-service business acceptance is owned by the Verification Platform, not this architecture tool.
  platform.api_e2e:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Cross-service API acceptance is owned by the Verification Platform.
  platform.event_e2e:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Cross-service event acceptance is owned by the Verification Platform.
  platform.browser_e2e:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Cross-service browser acceptance is owned by the Verification Platform.
  platform.contract_compatibility:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: Cross-service provider-consumer compatibility is owned by the Verification Platform.
  platform.architecture:
    applicability: APPLICABLE
    implementation: PRESENT
    commands: [test:platform:architecture]
  platform.reporting:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: This repository exposes orchestration and architecture read models, not normalized cross-repository test-result aggregation owned by the Verification Platform.

commands:
  check:format:
    availability: AVAILABLE
    invoke: [make, fmt-check]
    working_directory: .
    timeout_seconds: 900
    requires:
      - type: process
        mode: local
        probe: executable
        executable: go
  check:lint:
    availability: AVAILABLE
    invoke: [make, lint]
    working_directory: .
    timeout_seconds: 900
    requires:
      - type: process
        mode: local
        probe: executable
        executable: go
  check:types:
    availability: AVAILABLE
    invoke: [make, ui-test]
    working_directory: .
    timeout_seconds: 1800
    reason: Runs the owner UI's committed typecheck and test command; Go code is compiled by test-unit and checked by lint.
    requires:
      - type: process
        mode: local
        probe: executable
        executable: npm
  test:unit:
    availability: AVAILABLE
    invoke: [make, test-unit, runner-test]
    working_directory: .
    timeout_seconds: 2400
    reason: Runs the committed Go unit/workflow suite and pinned SDK runner tests.
    requires:
      - type: process
        mode: local
        probe: executable
        executable: go
      - type: process
        mode: local
        probe: executable
        executable: npm
  test:integration:deps:
    availability: AVAILABLE
    invoke: [make, test-integration]
    working_directory: .
    timeout_seconds: 3600
    reason: Runs the committed PostgreSQL integration suite against its disposable test database.
    requires:
      - type: database
        mode: disposable
        probe: docker
  test:architecture:
    availability: AVAILABLE
    invoke: [make, agent-policy]
    working_directory: .
    timeout_seconds: 120
  test:platform:architecture:
    availability: AVAILABLE
    invoke: [make, test-unit]
    working_directory: .
    timeout_seconds: 1800
    reason: Uses the owner-registered Go test suite, which includes topology, dependency, contract-drift, architecture manifest/catalog, and presentation tests; no narrower registered target exists.
    requires:
      - type: process
        mode: local
        probe: executable
        executable: go
  coverage:
    availability: UNAVAILABLE
    reason: No coverage command, threshold, or coverage artifact is declared by the committed command metadata or CI workflow.

references:
  contracts:
    - .ai/contracts/project-lifecycle.yaml
    - .ai/contracts/onboarding.yaml
    - .ai/contracts/runtime.yaml
  architecture:
    - .ai/architecture.yaml
    - .ai/architecture/service.yaml
    - .ai/architecture/processes/current-architecture-exploration.yaml
    - docs/architecture-conventions.md
    - docs/architecture-manifest-v1.md
    - README.md
  business_features: []

exceptions:
  - id: CDO-DEPENDENCY-INTEGRATION
    repository: course-dev-orchestrator
    categories: [integration.dependency]
    scope:
      description: The exception is limited to PostgreSQL-backed integration coverage; the full Temporal runtime is not part of the committed integration command.
      commands: [test:integration:deps]
    owner: Course Dev Orchestrator owners
    reason: The registered disposable integration command covers PostgreSQL-backed tests, while full live Temporal workflow rehearsal is a separate approval-gated MVP command and is not part of routine dependency integration.
    evidence:
      - git:740d500128572d75994a85636dd56ca15af3369a#.ai/commands.yaml
      - git:740d500128572d75994a85636dd56ca15af3369a#Makefile
      - git:740d500128572d75994a85636dd56ca15af3369a#test/integration/postgres_schema_test.go
    created_at: "2026-09-27"
    expires_at: "2026-12-26"
    remediation_target: Review PostgreSQL and Temporal dependency coverage separately and remove or renew only the unverified live-Temporal portion.
    tracking_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
    approval_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
  - id: CDO-LOCAL-ARCHITECTURE
    repository: course-dev-orchestrator
    categories: [architecture.local]
    scope:
      description: The exception is limited to code-layer architecture enforcement; repository-local agent-policy checks do not validate every Go dependency direction.
      commands: [test:architecture]
    owner: Course Dev Orchestrator owners
    reason: The registered agent-policy check validates the local agent architecture and canonical policy bundle, while the committed AGENTS architecture rules do not establish a dedicated code import-boundary test command.
    evidence:
      - git:740d500128572d75994a85636dd56ca15af3369a#AGENTS.md
      - git:740d500128572d75994a85636dd56ca15af3369a#.ai/commands.yaml
      - git:740d500128572d75994a85636dd56ca15af3369a#scripts/check-agent-policy.sh
    created_at: "2026-09-27"
    expires_at: "2026-12-26"
    remediation_target: Review whether the documented Go dependency direction needs a dedicated registered enforcement command and remove or renew only that gap.
    tracking_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
    approval_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
  - id: CDO-STATIC-QUALITY
    repository: course-dev-orchestrator
    categories: [quality.static]
    scope:
      description: The exception covers only missing TypeScript lint and formatting commands; Go format/static checks and the UI typecheck remain available.
      commands: [check:format, check:lint]
    owner: Course Dev Orchestrator owners
    reason: The committed native checks format Go and run go vet, and the UI target typechecks TypeScript, but no TypeScript formatter or lint command is registered.
    evidence:
      - git:740d500128572d75994a85636dd56ca15af3369a#Makefile
      - git:740d500128572d75994a85636dd56ca15af3369a#.ai/commands.yaml
      - git:740d500128572d75994a85636dd56ca15af3369a#web/package.json
      - git:740d500128572d75994a85636dd56ca15af3369a#.github/workflows/ci.yml
    created_at: "2026-09-27"
    expires_at: "2026-12-26"
    remediation_target: Reassess formatter and lint checks for the owner UI and remove or renew only the missing TypeScript checks.
    tracking_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
    approval_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
  - id: CDO-COVERAGE
    repository: course-dev-orchestrator
    categories: [coverage]
    scope:
      description: The exception is limited to absence of automated coverage measurement and reporting.
      commands: [coverage]
    owner: Course Dev Orchestrator owners
    reason: The committed command metadata, Makefile, and CI define no coverage command, threshold, or coverage artifact.
    evidence:
      - git:740d500128572d75994a85636dd56ca15af3369a#.ai/commands.yaml
      - git:740d500128572d75994a85636dd56ca15af3369a#Makefile
      - git:740d500128572d75994a85636dd56ca15af3369a#.github/workflows/ci.yml
    created_at: "2026-09-27"
    expires_at: "2026-12-26"
    remediation_target: Reassess coverage reporting and define scope only if the repository owner adopts it.
    tracking_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
    approval_reference: task:T3.2-BASELINE-ADOPTION-2026-09-27
