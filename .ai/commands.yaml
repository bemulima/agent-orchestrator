schema_version: 1
commands:
  - {name: context_test, run: make context-test, requires_approval: false, risk: verification}
  - {name: context_format, run: make context-format, requires_approval: false, risk: source_formatting}
  - {name: context_build, run: make context-build, requires_approval: false, risk: local_candidate_build}
  - {name: context_gold, run: make context-gold, requires_approval: false, risk: offline_fixture_verification}
  - {name: context_prepare, run: course-dev-orchestrator context-prepare --request-json <request> --route-json <route> --root <identity>=<admitted-root>, requires_approval: false, risk: read_only_admitted_source_inspection}
  - {name: context_expand, run: course-dev-orchestrator context-expand --request-json <request> --route-json <route> --root <identity>=<admitted-root> --base-pack-json <pack> --expand-json <selector>, requires_approval: false, risk: read_only_admitted_source_inspection}
  - {name: context_evaluate, run: course-dev-orchestrator context-evaluate --fixtures-dir <fixture-directory>, requires_approval: false, risk: offline_fixture_verification}
  - {name: agent_policy, run: make agent-policy, requires_approval: false, risk: verification}
  - {name: template_check, run: make agent-template-check, requires_approval: false, risk: verification}
  - {name: agent_control_check, run: make agent-control-check, requires_approval: false, risk: verification}
  - {name: agent_control_test, run: make agent-control-test, requires_approval: false, risk: verification}
  - {name: planner_route_test, run: make planner-route-test, requires_approval: false, risk: verification}
  - {name: agent_shard_test, run: make agent-shard-test, requires_approval: false, risk: verification}
  - {name: worker_test, run: make worker-test, requires_approval: false, risk: verification}
  - {name: plan_shards, run: make plan-shards PLAN_ID=<approved-plan-uuid>, requires_approval: true, risk: approved_plan_contract_materialization}
  - {name: plan_shard_remediate, run: make plan-shard-remediate PLAN_ID=<approved-plan-uuid> REMEDIATION_REQUEST=<owner-decision-json>, requires_approval: true, risk: approved_reviewer_remediation}
  - {name: plan_shard_run, run: make plan-shard-run PLAN_ID=<approved-plan-uuid>, requires_approval: true, risk: approved_plan_temporal_worker_fanout}
  - {name: agent_control_format, run: make fmt, requires_approval: false, risk: source_formatting}
  - {name: agent_assets_plan, run: course-dev-orchestrator agent-assets-plan --root <repository>, requires_approval: false, risk: read_only_repository_inspection}
  - {name: agent_assets_apply, run: course-dev-orchestrator agent-assets-apply --root <repository> --approve-fingerprint <sha256>, requires_approval: true, risk: managed_repository_policy_write}
  - {name: agent_policy_plan, run: course-dev-orchestrator agent-policy-plan --target <explicit-path>, requires_approval: false, risk: read_only_user_config_inspection}
  - {name: diff_check, run: make diff-check, requires_approval: false, risk: verification}
  - {name: format_check, run: make fmt-check, requires_approval: false, risk: verification}
  - {name: vet, run: make lint, requires_approval: false, risk: verification}
  - {name: test, run: make test-unit, requires_approval: false, risk: verification}
  - {name: sandbox_test, run: make sandbox-test, requires_approval: false, risk: verification}
  - {name: sandbox_runtime_probe, run: python3 scripts/probe-production-sandbox.py --image <trusted-built-image> --output <evidence-json>, requires_approval: true, risk: disposable_credential_free_container}
  - {name: runner_test, run: make runner-test, requires_approval: false, risk: verification}
  - {name: ui_test, run: make ui-test, requires_approval: false, risk: verification}
  - {name: ui_build, run: make ui-build, requires_approval: false, risk: build}
  - {name: compose_check, run: make compose-check, requires_approval: false, risk: verification}
  - {name: verify, run: make verify, requires_approval: false, risk: verification}
  - {name: backup, run: make backup BACKUP_COMPONENT=orchestrator-postgres, requires_approval: true, risk: portable_backup_write}
  - {name: backup_status, run: make backup-status, requires_approval: false, risk: read_only_backup_metadata}
  - {name: restore_check, run: make restore-check BACKUP_SET=/Volumes/ZX10/platform-backups/course-dev-orchestrator/postgres/REPLACE_ME RESTORE_TARGET=d4-restore-postgres-REPLACE_ME, requires_approval: true, risk: disposable_container_and_volume}
  - {name: project_list, run: make project-list, requires_approval: false, risk: read_only_catalog}
  - {name: project_show, run: make project-show SERVICE=id-or-name, requires_approval: false, risk: read_only_catalog}
  - {name: project_archive, run: make project-archive SERVICE=id-or-name, requires_approval: true, risk: reversible_catalog_state_change}
  - {name: project_restore, run: make project-restore SERVICE=id-or-name, requires_approval: true, risk: reversible_catalog_state_change}
  - {name: integration_test, run: make test-integration, requires_approval: true, risk: disposable_database_and_container}
  - {name: migrations, run: make migrate, requires_approval: true, risk: database_state_change}
  - {name: migrations_down, run: make migrate-down, requires_approval: true, risk: database_schema_rollback}
  - {name: local_stack, run: make up, requires_approval: true, risk: lifecycle}
  - {name: local_stack_down, run: make down, requires_approval: true, risk: lifecycle}
  - {name: mvp_rehearsal, run: make mvp-rehearsal, requires_approval: true, risk: container_and_disposable_state}

  - {name: architecture_export, run: make architecture-export, requires_approval: false, risk: read_only_immutable_catalog_export}
  - {name: architecture_export_build, run: make architecture-export-build, requires_approval: false, risk: build}
  - {name: architecture_export_test, run: make architecture-export-test, requires_approval: false, risk: verification}
  - {name: architecture_export_format, run: make architecture-export-format, requires_approval: false, risk: source_formatting}

  - {name: sandbox_sdk_probe, run: python3 scripts/probe-sdk-broker.py --image <trusted-built-image> --output <evidence-json>, requires_approval: true, risk: disposable_fake_model_real_sdk}
  - {name: sandbox_model_certification, run: course-dev-orchestrator sandbox-certification-model --fixture <approved-disposable-fixture> --evidence <evidence-json>, requires_approval: true, risk: metered_disposable_real_model}

  - {name: sandbox_broker_lifecycle, run: python3 scripts/probe-broker-lifecycle.py --image <trusted-built-image> --output <evidence-json>, requires_approval: true, risk: disposable_oci_lifecycle_limits}

  - {name: sandbox_sdk_cleanup, run: python3 scripts/probe-sdk-cleanup.py --image <trusted-built-image> --output <evidence-json>, requires_approval: true, risk: disposable_sdk_cancel_crash}

  - {name: sandbox_certification_build, run: make sandbox-certification-build, requires_approval: false, risk: local_candidate_build}

  - {name: sandbox_sdk_state_boundary, run: python3 scripts/probe-sdk-state-boundary.py --image <trusted-built-image> --output <evidence-json>, requires_approval: true, risk: disposable_sdk_state_quota_isolation}

  - {name: go_dependency_prepare, run: python3 runner/bin/cdo_go_dependencies.py --source <approved-root> --output <immutable-bundle> --image <trusted-image> --go-mod-sha256 <approved-hash> --go-sum-sha256 <approved-hash> --execution-id <trusted-id>, requires_approval: true, risk: trusted_dependency_download}
  - {name: go_dependency_probe, run: python3 scripts/probe-go-dependencies.py --image <trusted-image> --output <evidence-json>, requires_approval: true, risk: disposable_external_module_verification}

  - {name: lifecycle_temporal_certification, run: python3 scripts/probe-temporal-lifecycle.py --output <evidence-directory> --case all, requires_approval: true, risk: disposable_temporal_actual_sdk_lifecycle}

  - {name: lifecycle_process_isolation, run: python3 scripts/probe-lifecycle-isolation.py <evidence-json>, requires_approval: true, risk: disposable_known_pid_namespace_probe}
  - {name: lifecycle_reconcile, run: python3 runner/bin/cdo_reconcile.py <trusted-execution-audit>, requires_approval: true, risk: invalid_disposable_execution_cleanup}

  - {name: production_release_build, run: python3 scripts/build-production-release.py --output <fresh-evidence-directory> --tag <release-tag>, requires_approval: true, risk: approved_exact_release_build}

  - {name: sandbox_runtime_transport, run: python3 scripts/probe-runtime-transport.py --output <fresh-evidence-directory>, requires_approval: true, risk: disposable_authenticated_host_controller_no_socket_mount}
