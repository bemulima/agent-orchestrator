schema: architecture/v1
kind: service
id: course-dev-orchestrator
manifest_revision: 1
identity:
    name: course-dev-orchestrator
    kind: internal_control_plane
purpose:
    value: Discover backend repositories and coordinate owner-approved development plans with durable execution and architecture visibility.
    confidence: 0.98
    evidence:
        - source_path: internal/adapters/http/router.go
responsibilities:
    - value: Connect and scan allowed repositories into immutable discovery snapshots and project a versioned CURRENT architecture catalog.
      confidence: 0.98
      evidence:
        - source_path: internal/usecase/project/scan_project.go
        - source_path: internal/usecase/architecture/architecture.go
    - value: Prepare issue-backed development plans and require an owner decision before publication and execution.
      confidence: 0.98
      evidence:
        - source_path: internal/usecase/planning/planning.go
    - value: Schedule dependent development tasks through Temporal and independently verify agent results.
      confidence: 0.98
      evidence:
        - source_path: internal/workflow/plan.go
        - source_path: internal/execution/service.go
capabilities:
    - value: Repository lifecycle and read-only discovery; topology and contract drift; service and operation architecture drilldown.
      confidence: 0.98
      evidence:
        - source_path: internal/adapters/http/router.go
    - value: Plan discussion and versioning; issue preparation and publication; approval; run control; task verification; owner conversations and usage reporting.
      confidence: 0.98
      evidence:
        - source_path: internal/adapters/http/router.go
owned_resources:
    - type: database
      name: project / service_snapshot / topology_revision / topology_service / contract_drift
      description:
        value: Persist project identity and immutable discovery evidence plus the materialized topology and drift catalog.
        confidence: 1
        evidence:
            - source_path: db/migrations/001_initial_schema.up.sql
            - source_path: db/migrations/005_stage4_topology.up.sql
    - type: database
      name: command / plan / task / task_dependency / task_attempt / plan_run / approval / work_item / artifact / audit_event
      description:
        value: Own development intent and approved task graphs together with durable progress and verification artifacts.
        confidence: 1
        evidence:
            - source_path: db/migrations/001_initial_schema.up.sql
            - source_path: db/migrations/006_stage5_planning.up.sql
            - source_path: db/migrations/010_issue_backed_planning.up.sql
    - type: database
      name: conversation / conversation_message / action_proposal / agent_run_usage / telegram_update / telegram_callback / telegram_poll_state
      description:
        value: Persist owner conversations and proposed actions plus metered agent usage and deduplicated Telegram delivery state.
        confidence: 1
        evidence:
            - source_path: db/migrations/009_stage8_telegram.up.sql
            - source_path: db/migrations/012_owner_conversations.up.sql
            - source_path: db/migrations/013_agent_usage_and_routing.up.sql
inbound_interfaces:
    - transport: http
      name: internal API and health endpoints
      description:
        value: Serve owner read models and resource-bound state transitions through /api/v1 plus /health and /ready.
        confidence: 1
        evidence:
            - source_path: internal/adapters/http/router.go
    - transport: temporal
      name: configured Temporal task queue
      description:
        value: Consume PlanWorkflow and SystemProbeWorkflow with registered plan and system activities.
        confidence: 1
        evidence:
            - source_path: cmd/course-dev-orchestrator/main.go
              symbol: runWorker
    - transport: http
      name: Telegram updates
      description:
        value: Optional Telegram process consumes long-poll updates; webhook mode consumes updates through its HTTP endpoint.
        confidence: 1
        evidence:
            - source_path: internal/adapters/telegram/poller.go
            - source_path: cmd/course-dev-orchestrator/main.go
outbound_dependencies:
    - id: postgres
      transport: sql
      target: PostgreSQL
      direction: outbound
      description:
        value: Read and persist authoritative metadata through pgx repositories.
        confidence: 1
        evidence:
            - source_path: cmd/course-dev-orchestrator/main.go
    - id: temporal
      transport: temporal
      target: Temporal
      direction: outbound
      description:
        value: Start durable plan workflows and send pause/resume/cancel and task retry controls.
        confidence: 1
        evidence:
            - source_path: internal/adapters/temporal/plan_runner.go
    - id: codex
      transport: subprocess
      target: Codex SDK runner
      direction: outbound
      description:
        value: Run bounded agent roles and validate structured results before accepting their claims.
        confidence: 0.98
        evidence:
            - source_path: internal/execution/service.go
            - source_path: cmd/course-dev-orchestrator/main.go
    - id: work-item-gateway
      transport: http
      target: configured GitHub work-item gateway
      direction: outbound
      description:
        value: Publish approved work items through the selected gateway; fake and dry-run configurations suppress real publication.
        confidence: 0.98
        evidence:
            - source_path: internal/workitem/issue_publisher.go
    - id: telegram
      transport: http
      target: Telegram Bot API
      direction: outbound
      description:
        value: Optional owner command transport receives updates and sends bounded replies.
        confidence: 1
        evidence:
            - source_path: internal/adapters/telegram/poller.go
            - source_path: internal/usecase/telegram/service.go
    - id: runtime-nats
      transport: nats
      target: unknown
      direction: unknown
      description:
        value: unknown
        confidence: 0
        evidence:
            - source_path: cmd/course-dev-orchestrator/main.go
