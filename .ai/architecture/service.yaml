business_rules:
    - value: Architecture CURRENT is read from evidence-backed discovery and topology; source repositories are not changed by catalog reads.
      confidence: 0.98
      evidence:
        - source_path: internal/usecase/architecture/architecture.go
    - value: Execution depends on an approved issue-backed plan and bounded task scheduling; newly reported prerequisites pause for replanning.
      confidence: 0.98
      evidence:
