        confidence: 0.98
        evidence:
            - source_path: internal/adapters/http/router.go
consumed_contracts:
    - transport: temporal
      code: PlanSchedule
      direction: consumed
      description:
        value: Durable execution input supplies plan/run identities and task dependencies with bounded concurrency and activity attempts.
        confidence: 1
        evidence:
            - source_path: internal/workflow/plan.go
published_events:
    - transport: http
      code: GET /api/v1/events
      direction: produced
      description:
