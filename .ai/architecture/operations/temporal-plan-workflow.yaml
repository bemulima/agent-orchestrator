schema: architecture/v1
kind: operation
id: temporal-plan-workflow
manifest_revision: 1
service_id: course-dev-orchestrator
type: worker
identity:
  transport: worker
  worker: {name: PlanWorkflow}
access:
  audience: {value: "Temporal task-queue worker consuming plan schedules", confidence: 1, evidence: [{source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}]}
  authentication: {value: unknown, confidence: 0, evidence: [{source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}]}
  authorization: {value: "RunPlan use case gates plan start; workflow validates schedule before any dispatch", confidence: 0.98, evidence: [{source_path: internal/usecase/planning/planning.go}, {source_path: internal/workflow/plan.go, symbol: PlanWorkflow}]}
  idempotency: {value: "Temporal workflow identity and persisted task transitions support retries and replay", confidence: 0.98, evidence: [{source_path: internal/adapters/temporal/plan_runner.go}, {source_path: internal/activities/plan.go}]}
trigger:
  description: {value: "Temporal starts registered PlanWorkflow on configured task queue with a PlanSchedule", confidence: 1, evidence: [{source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}, {source_path: internal/adapters/temporal/plan_runner.go}]}
input:
  path_params: []
  query: []
  headers: []
  body:
    name: domain.PlanSchedule
    description: {value: "Run and plan identities; tasks and prerequisites; parallelism and attempt bounds; execution mode", confidence: 1, evidence: [{source_path: internal/workflow/plan.go, symbol: PlanWorkflow}]}
business_task: {value: "Execute the approved development DAG with durable progress and controlled retries", confidence: 1, evidence: [{source_path: internal/workflow/plan.go}]}
business_process:
  - id: validate
    description: {value: "Validate the schedule and initialize task status; register state query and control signal channels", confidence: 1, evidence: [{source_path: internal/workflow/plan.go, symbol: PlanWorkflow}]}
    interactions: []
  - id: dispatch
    description: {value: "Persist running state; dispatch dependency-ready tasks within configured concurrency through plan activities", confidence: 1, evidence: [{source_path: internal/workflow/plan.go}, {source_path: internal/activities/plan.go}]}
    interactions: [postgres, codex]
  - id: control
    description: {value: "Handle task results and pause/resume/cancel/retry signals; persist terminal or paused run state", confidence: 1, evidence: [{source_path: internal/workflow/plan.go}]}
    interactions: [postgres]
business_rules:
  - {value: "Deterministic workflow code delegates database and agent effects to activities", confidence: 1, evidence: [{source_path: internal/workflow/plan.go}, {source_path: internal/activities/plan.go}]}
  - {value: "Blocked and changes-requested task results pause execution; failures and cancellations terminate according to workflow control", confidence: 1, evidence: [{source_path: internal/workflow/plan.go}]}
  - {value: "Global activity concurrency is capped by MaxGlobalAgentRuns in worker registration", confidence: 1, evidence: [{source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}]}
implementation:
  router: [{source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}]
  handler: [{source_path: internal/workflow/plan.go, symbol: PlanWorkflow}]
  use_cases: [{source_path: internal/activities/plan.go}, {source_path: internal/execution/service.go}]
  domain_services: [{source_path: internal/domain/execution.go}]
  repositories: [{source_path: internal/adapters/postgres/planning_repository.go}, {source_path: internal/adapters/postgres/execution_repository.go}]
data_access:
  - resource: plan_run / task / task_attempt / task_review / artifact
    access: read_write
    description: {value: "Activities persist run status and task outcomes; executor persists attempts and verification artifacts", confidence: 1, evidence: [{source_path: internal/activities/plan.go}, {source_path: internal/execution/service.go}]}
external_interactions:
  - id: postgres
    transport: sql
    target: PostgreSQL
    direction: outbound
    description: {value: "Activity repository calls persist execution state", confidence: 1, evidence: [{source_path: internal/activities/plan.go}]}
  - id: codex
    transport: subprocess
    target: Codex SDK runner
    direction: outbound
    description: {value: "Executor invokes coder and reviewer and independently verifies their results when ExecuteTasks is enabled", confidence: 0.98, evidence: [{source_path: internal/execution/service.go}]}
side_effects:
  - type: repository_execution
    description: {value: "Configured executor can create task workspaces and verified local commits; execution artifacts and status are persisted", confidence: 0.98, evidence: [{source_path: internal/execution/service.go}, {source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}]}
output:
  responses: []
  result:
    name: PlanWorkflowOutput
    description: {value: "Run ID and plan ID with final status and task-status map; error text when failed", confidence: 1, evidence: [{source_path: internal/workflow/plan.go, symbol: PlanWorkflowOutput}]}
  emitted_events: []
errors:
  - code: invalid_schedule
    description: {value: "Reject invalid task schedules before dispatch", confidence: 1, evidence: [{source_path: internal/workflow/plan.go, symbol: validateSchedule}]}
  - code: activity_failure
    description: {value: "Retry bounded activity failures; persist failed plan for unrecoverable execution or state updates", confidence: 1, evidence: [{source_path: internal/workflow/plan.go}]}
evidence: [{source_path: cmd/course-dev-orchestrator/main.go, symbol: runWorker}, {source_path: internal/workflow/plan.go}]
confidence: 0.98
