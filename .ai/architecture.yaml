schema_version: 1
style: layered_ports_and_adapters_with_durable_workflows
entrypoints:
  cli_api_worker: cmd/course-dev-orchestrator/main.go
  owner_ui: web/src/app
layers:
  domain: internal/domain
  usecases: internal/usecase
  adapters: internal/adapters
  discovery: internal/discovery
  onboarding: internal/onboarding
  planning: internal/planning
  execution: internal/execution
  temporal_workflows: internal/workflow
  temporal_activities: internal/activities
state_ownership:
  postgresql: projects snapshots proposals plans tasks attempts reviews approvals audit and external projections
  temporal: durable execution scheduling signals retries and recovery
safety_boundaries:
  connected_checkout: read_only
  approved_writes: isolated_worktree_and_exact_scope
  agent_claims: schema_and_independent_verification
  external_publication: explicit_owner_gate
  automatic_merge_or_deploy: absent
agent_policy:
  canonical_template: internal/onboarding/templates/v1
  repository_materialization: .ai/rules/common.md plus project evidence
