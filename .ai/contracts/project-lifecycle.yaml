schema_version: 1
source_of_truth: docs/architecture-conventions.md
archive:
  reversible: true
  deletes_repository_or_history: false
  rejected_while_status: scanning
  preserves: [project, snapshots, plans, tasks, artifacts, audit]
  stores: [archived_at, archived_from_status]
  excludes_from: [default_project_list, discovery, onboarding, planning, conversations, topology_rebuild, task_execution]
restore:
  target_status: exact_archived_from_status
  clears: [archived_at, archived_from_status]
api:
  list_all: GET /api/v1/projects?include_archived=true
  archive: POST /api/v1/projects/{projectId}/archive
  restore: POST /api/v1/projects/{projectId}/restore
remote_archive_or_delete: absent
