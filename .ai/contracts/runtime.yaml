schema_version: 1
source_of_truth: docs/architecture-conventions.md
process_modes: [api, worker, cli, telegram]
owner_ui: separate_nextjs_process
durable_state:
  query_and_audit: postgresql
  scheduling_and_recovery: temporal
readiness_dependencies: [postgresql, temporal]
repository_access:
  allowed_roots_required: true
  env_files_read: false
  connected_sources_mutated_before_approval: false
agent_execution:
  one_task_one_repository_worktree_branch_thread: true
  coder_network: disabled
  reviewer_thread_separate: true
  secret_environment_inheritance: none
external_actions:
  issues_and_pull_requests: bounded_gateway_and_explicit_gate
  legacy_gitlab_real_write: disabled
  merge: absent
  deploy: absent
