schema_version: 1
assets:
  - id: global-policy
    kind: global_policy
    source_path: agent-system/global/AGENTS.md
    ownership: MANAGED
    version: 1.1.0
    target_path: ~/.codex/AGENTS.md
    profiles: ["*"]
    checksum: computed
  - id: skill/task-route
    kind: skill
    source_path: agent-system/skills/task-route
    ownership: MANAGED
    version: 1.1.0
    target_path: .agents/skills/task-route
    profiles: [go.canonical, nextjs.common]
    checksum: computed
  - id: skill/contract-plan
    kind: skill
    source_path: agent-system/skills/contract-plan
    ownership: MANAGED
    version: 1.2.0
    target_path: .agents/skills/contract-plan
    profiles: [go.canonical, nextjs.common]
    checksum: computed
  - id: profile/go.canonical
    kind: architecture_profile
    source_path: agent-system/profiles/go-canonical.yaml
    ownership: MANAGED
    version: 1.3.1
    target_path: .agents/profiles/go-canonical.yaml
    profiles: [go.canonical]
    checksum: computed
  - id: profile/nextjs.common
    kind: architecture_profile
    source_path: agent-system/profiles/nextjs-common.yaml
    ownership: MANAGED
    version: 1.2.0
    target_path: .agents/profiles/nextjs-common.yaml
    profiles: [nextjs.common]
    checksum: computed

# Central implementation evidence. Reevaluate readiness for each target task.
workflow_capabilities:
  - id: task-route
    status: READY_VERIFIED
    scope: "Read-only evidence-backed responsibility routing"
    profiles: ["go.canonical", "nextjs.common"]
    evidence: ["internal/planning/routing.go", "agent-system/skills/task-route/SKILL.md"]
    execution_requirements: ["Matching profile and current repository source evidence"]
  - id: contract-plan
    status: READY_VERIFIED
    scope: "Minimum shared-boundary planning; FREEZE_REQUIRED is not a frozen baseline"
    profiles: ["go.canonical", "nextjs.common"]
    evidence: ["internal/planning/validator.go", "agent-system/skills/contract-plan/SKILL.md"]
    execution_requirements: ["Approved task scope and evidence-backed routes; write decision satisfied"]
  - id: architecture-profiles
    status: READY_VERIFIED
    scope: "Go canonical and Next.js common structural profile definitions"
    profiles: ["go.canonical", "nextjs.common"]
    evidence: ["agent-system/profiles/go-canonical.yaml", "agent-system/profiles/nextjs-common.yaml"]
    execution_requirements: ["Structural source evidence; select Next.js student/admin only from facts"]
  - id: architectural-shards
    status: READY_VERIFIED
    scope: "Planning of ownership and baseline readiness; not runtime permission"
    profiles: ["go.canonical", "nextjs.common"]
    evidence: ["internal/planning/shards.go", "internal/planning/readiness.go"]
    execution_requirements: ["Approved Plan and concrete file/symbol scopes"]
  - id: workpackages
    status: PARTIALLY_IMPLEMENTED
    scope: "Execution intents and verification commands specialize Go availability canary"
    profiles: ["go.canonical", "nextjs.common"]
    evidence: ["internal/planning/workpackage.go"]
    execution_requirements: ["Three supported availability routes; generic and frontend intents need implementation"]
  - id: contract-freeze
    status: CANARY_VERIFIED
    scope: "Go availability behavior-free contracts with separate reviewer and exact baseline"
    profiles: ["go.canonical"]
    evidence: ["internal/usecase/contractfreeze/service.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["Approved Plan; trusted isolation; permitted execution; clean baseline; contract reviewer PASS"]
  - id: go-layer-workers
    status: CANARY_VERIFIED
    scope: "Availability HTTP/usecase/persistence only; domain/client/messaging/migration execution not generally proven"
    profiles: ["go.canonical"]
    evidence: ["internal/usecase/shardexecution/service.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["Same frozen baseline; scoped writes; semantic RED; real PostgreSQL persistence boundary; independent GREEN"]
  - id: nextjs-workers
    status: PARTIALLY_IMPLEMENTED
    scope: "Profiles and routing exist; frontend WorkPackage/RED/integration/composition execution remains incomplete"
    profiles: ["nextjs.common"]
    evidence: ["internal/planning/workpackage.go", "agent-system/profiles/nextjs-common.yaml"]
    execution_requirements: ["Stack-specific execution intents and verification must be implemented and verified before fan-out"]
  - id: fanout
    status: CANARY_VERIFIED
    scope: "At least two independent availability workers without dependencies"
    profiles: ["go.canonical"]
    evidence: ["internal/workflow/shard_fanout.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["Approved Plan; FROZEN baseline; READY_FOR_FANOUT; permitted Temporal/persistence runtime"]
  - id: barrier
    status: CANARY_VERIFIED
    scope: "Required availability shards VERIFIED before integration or composition"
    profiles: ["go.canonical"]
    evidence: ["internal/usecase/shardexecution/service.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["All required verified commits and exact baseline evidence"]
  - id: composition
    status: CANARY_VERIFIED
    scope: "Serialized availability wiring in two approved cmd/availability-service paths"
    profiles: ["go.canonical"]
    evidence: ["internal/usecase/shardexecution/composition_package.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["BARRIER_READY; typed scope; meaningful wiring RED/GREEN; no sibling implementation repairs"]
  - id: independent-verification
    status: CANARY_VERIFIED
    scope: "Availability mechanical integration checks and separate read-only reviewer"
    profiles: ["go.canonical"]
    evidence: ["internal/usecase/shardexecution/service.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["Deterministic assembly; frozen hash identity; independent reviewer; real full-chain verification"]
  - id: managed-asset-distribution
    status: PARTIALLY_IMPLEMENTED
    scope: "Pure proposal/approval model verified; filesystem distributor has four unresolved source P1 findings"
    profiles: ["go.canonical", "nextjs.common"]
    evidence: ["internal/agentcontrol/distribution.go", "internal/agentcontrol/localrepo/repository.go"]
    execution_requirements: ["Bounded trusted fixture use only; real target plan/apply requires explicit owner decision and closure of sensitive reads, source admission, symlink races and inventory bounds"]
  - id: ordinary-configured-local-execution
    status: UNKNOWN
    scope: "Historical local runner path exists; current runtime/auth permission not probed"
    evidence: ["internal/adapters/codex/runner.go", "docs/agent-workflow-closure.md"]
    execution_requirements: ["Existing permitted development path established for this task; no silent backend fallback"]
  - id: production-hardened-execution
    status: BLOCKED
    scope: "Source components preserved; production release/runtime/model certification deferred"
    evidence: ["docs/production-sandbox.md", "docs/agent-workflow-closure.md"]
    execution_requirements: ["Fresh explicit owner decision; production admission DENIED until separately certified"]
  - id: future-task-owner-checkpoint
    status: READY_VERIFIED
    scope: "Always-on interactive policy and pure guarded action decision; not a retrofit of all legacy dispatchers"
    evidence: ["AGENTS.md", "internal/agentcontrol/task_decision.go", "internal/agentcontrol/task_decision_test.go"]
    execution_requirements: ["Repository/task evidence; matching explicit owner choice where required; security gates independent"]
