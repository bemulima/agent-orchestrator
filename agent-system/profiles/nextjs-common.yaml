schema_version: 1
id: nextjs.common
name: Common Next.js module architecture
stack: nextjs
repo_shape:
  required: [package.json, src/app/]
contract_location:
  directory: src/shared/contracts
  language: typescript
  extension: .ts
composition_surfaces: [src/app/layout.tsx, src/app/providers.tsx, src/app-runtime/, src/shared/bff/, src/app/api/, src/shared/ui/]
variants:
  - id: student
    route_hints: [frontend.route, frontend.module.ui, frontend.module.usecase, frontend.module.api, frontend.module.model]
    candidate_roots: [src/app/student/**, src/app/(student)/**, src/modules/student/**]
  - id: admin
    route_hints: [frontend.route, frontend.module.ui, frontend.module.usecase, frontend.module.api, frontend.module.model]
    candidate_roots: [src/app/admin/**, src/app/(admin)/**, src/modules/admin/**]
routes:
  - id: frontend.route
    purpose: Next.js app routes, layouts, and route handlers.
    target_candidates: [src/app/**]
    contracts_to_inspect: [route params, page/layout behavior, HTTP boundary when a route handler exists]
    shared_boundary_candidates: [route-to-module, bff-request-response]
    require_evidence: true
    verification_kinds: [handler-test, build]
  - id: frontend.module.ui
    purpose: Feature-module UI and module-owned presentation.
    target_candidates: [src/modules/*/internal/ui/**]
    contracts_to_inspect: [UI props, behavior, accessibility]
    shared_boundary_candidates: [usecase-input-output, shared-ui-props, i18n-keys]
    require_evidence: true
    verification_kinds: [component-test, typecheck]
  - id: frontend.module.usecase
    purpose: Feature-module application/usecase behavior.
    target_candidates: [src/modules/*/internal/usecases/**]
    contracts_to_inspect: [usecase input/output and error behavior]
    shared_boundary_candidates: [usecase-input-output, api-adapter-boundary, model-schema]
    require_evidence: true
    verification_kinds: [typecheck]
  - id: frontend.module.api
    purpose: Feature-module API adapters and transport mapping.
    target_candidates: [src/modules/*/internal/api/**]
    contracts_to_inspect: [API schema, request/response and error mapping]
    shared_boundary_candidates: [api-adapter-boundary, model-schema, bff-request-response]
    require_evidence: true
    verification_kinds: [typecheck]
  - id: frontend.module.model
    purpose: Feature-module domain models and schemas.
    target_candidates: [src/modules/*/internal/model/**]
    contracts_to_inspect: [model types, invariants, serialization]
    shared_boundary_candidates: [model-schema]
    require_evidence: true
    verification_kinds: [typecheck]
  - id: frontend.shared.bff
    purpose: Shared backend-for-frontend adapters and request/response boundaries.
    target_candidates: [src/shared/bff/**, src/app/api/**]
    contracts_to_inspect: [BFF request/response, cache and error behavior]
    shared_boundary_candidates: [bff-request-response, api-adapter-boundary]
    require_evidence: true
    verification_kinds: [handler-test, build]
  - id: frontend.shared.ui
    purpose: Reusable cross-module UI components.
    target_candidates: [src/shared/ui/**, src/shared/components/**]
    contracts_to_inspect: [shared component props and behavior]
    shared_boundary_candidates: [shared-ui-props]
    require_evidence: true
    verification_kinds: [component-test, typecheck]
  - id: frontend.app-runtime
    purpose: App-wide providers, runtime configuration, and framework setup.
    target_candidates: [src/app-runtime/**]
    contracts_to_inspect: [provider and runtime configuration contracts]
    require_evidence: true
    verification_kinds: [typecheck, build]
  - id: frontend.i18n
    purpose: Locale selection, translation resources, and localization helpers.
    target_candidates: [src/shared/i18n/**, src/shared/lib/i18n/**, src/i18n/**, messages/**]
    contracts_to_inspect: [translation keys, interpolation inputs, locale fallback]
    shared_boundary_candidates: [i18n-keys]
    require_evidence: true
    verification_kinds: [typecheck]
