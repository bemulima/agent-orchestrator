schema_version: 1
id: go.canonical
name: Common Go layered architecture
stack: go
repo_shape:
  required: [go.mod, internal/domain/, internal/usecase/, internal/transport/, internal/infrastructure/]
contract_location:
  language: go
  extension: .go
  standard_library_imports: allow
  third_party_import_policy: project_dependencies
  external_service_imports: []
boundary_ownership:
  - kind: application-command-result
    owner_routes: [backend.usecase]
  - kind: repository-port
    owner_routes: [backend.domain]
    implementer_routes: [backend.infrastructure.persistence]
composition_surfaces: [cmd/, internal/composition/, internal/bootstrap/, internal/server/]
routes:
  - id: backend.domain
    purpose: Domain types, invariants, and business concepts.
    target_candidates: [internal/domain/**, domain/**, internal/port/**]
    allowed_dependencies: []
    contract_surface:
      directory: internal/domain
      package_name: domain
    interface_candidates: [internal/domain/repository/**, internal/domain/ports.go, internal/port/**]
    contracts_to_inspect: [domain types, invariants, repository ports]
    shared_boundary_candidates: [domain-model]
    require_evidence: true
    verification_kinds: [domain-unit]
  - id: backend.usecase
    purpose: Application orchestration and business processes.
    target_candidates: [internal/usecase/**, internal/application/**, usecase/**, application/**]
    allowed_dependencies: [backend.domain]
    contract_surface:
      directory: internal/usecase
      package_name: usecase
      allowed_values: [ErrInvalidRequest]
    contracts_to_inspect: [application command/result, repository ports]
    shared_boundary_candidates: [domain-model, application-command-result, repository-port, external-client-port, publisher-port]
    interface_candidates: [internal/domain/repository/**, internal/domain/ports.go, internal/port/**, internal/usecase/**]
    require_evidence: true
    verification_kinds: [usecase-unit]
  - id: backend.transport.http
    purpose: Incoming HTTP routing, handlers, DTOs, and response mapping.
    target_candidates: [internal/adapters/http/**, internal/transport/http/**, transport/http/**]
    allowed_dependencies: [backend.domain, backend.usecase]
    contracts_to_inspect: [HTTP request/response, error mapping]
    shared_boundary_candidates: [application-command-result, http-route-registration]
    require_evidence: true
    verification_kinds: [handler-test]
  - id: backend.transport.message
    purpose: Incoming queue, event, or message-consumer transport.
    target_candidates: [internal/adapters/nats/**, internal/adapters/messaging/**, internal/transport/message/**, internal/consumer/**]
    allowed_dependencies: [backend.domain, backend.usecase]
    contracts_to_inspect: [message envelope, consumer acknowledgement and retry]
    shared_boundary_candidates: [application-command-result, message-envelope]
    require_evidence: true
    verification_kinds: [handler-test]
  - id: backend.infrastructure.persistence
    purpose: SQL, PostgreSQL, storage implementation, and persistence adapters.
    target_candidates: [internal/adapters/postgres/**, internal/infrastructure/persistence/**, internal/repository/postgres/**, repository/postgres/**]
    allowed_dependencies: [backend.domain]
    contracts_to_inspect: [repository port, database schema, transaction semantics]
    shared_boundary_candidates: [repository-port, database-schema]
    interface_candidates: [internal/domain/repository/**, internal/domain/ports.go, internal/port/**, internal/usecase/**]
    require_evidence: true
    verification_kinds: [integration-test]
  - id: backend.infrastructure.client
    purpose: Outgoing HTTP or RPC client adapters.
    target_candidates: [internal/adapters/client/**, internal/adapters/httpclient/**, internal/infrastructure/client/**, internal/infrastructure/http/**, internal/infrastructure/adapters/**]
    allowed_dependencies: [backend.domain]
    contracts_to_inspect: [external client port, request/response and error mapping]
    shared_boundary_candidates: [external-client-port]
    interface_candidates: [internal/domain/repository/**, internal/domain/ports.go, internal/port/**, internal/usecase/**]
    require_evidence: true
    verification_kinds: [integration-test]
  - id: backend.infrastructure.messaging
    purpose: Outgoing event/message publishers and broker adapters.
    target_candidates: [internal/adapters/nats/**, internal/adapters/messaging/**, internal/infrastructure/messaging/**, internal/publisher/**]
    allowed_dependencies: [backend.domain]
    contracts_to_inspect: [publisher port, event/message envelope]
    shared_boundary_candidates: [publisher-port, message-envelope]
    interface_candidates: [internal/domain/repository/**, internal/domain/ports.go, internal/port/**, internal/usecase/**]
    require_evidence: true
    verification_kinds: [integration-test]
  - id: backend.migration
    purpose: Versioned database schema changes and migration support.
    target_candidates: [db/migrations/**, migrations/**]
    allowed_dependencies: []
    contracts_to_inspect: [database schema, migration compatibility]
    shared_boundary_candidates: [database-schema]
    require_evidence: true
    verification_kinds: [migration-check]
  - id: backend.composition
    purpose: Dependency injection, service construction, route/subscription registration, and process wiring.
    target_candidates: [cmd/**, internal/bootstrap/**, internal/composition/**, internal/server/**]
    allowed_dependencies: [backend.domain, backend.usecase, backend.transport.http, backend.transport.message, backend.infrastructure.persistence, backend.infrastructure.client, backend.infrastructure.messaging]
    contracts_to_inspect: [dependency registration, route/subscription wiring]
    shared_boundary_candidates: [http-route-registration, message-consumer-registration]
    require_evidence: true
    shared_hotspot: true
    verification_kinds: [owner-review]
