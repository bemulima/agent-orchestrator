classification:
  concern: sql-query
  repository_variant: go.canonical
routes:
  - primary: backend.infrastructure.persistence
    reason: SQL query implementation belongs to the verified persistence adapter
targets:
  - <verified persistence adapter path>
contracts_to_inspect:
  - <verified repository port>
  - <relevant database schema or migration>
verification_boundary:
  preferred: repository integration test
  evidence: <verified repository test path>
avoid:
  - <unrelated transport route>
  - <unrelated application route>
evidence:
  - source: <source path found in the target repository>
    fact: contains the existing SQL implementation for this behavior
confidence: high
