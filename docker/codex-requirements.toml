default_permissions = "cdo-read-only"

[allowed_permission_profiles]
cdo-workspace-write = true
cdo-read-only = true

[permissions.cdo-workspace-write]
description = "Read minimal runtime files and write only the assigned workspace."

[permissions.cdo-workspace-write.filesystem]
":minimal" = "read"
"/app/runner/node_modules/@openai/codex-linux-arm64" = "read"
"/usr/local/bin" = "read"
"/usr/local/go" = "read"
"/data/cache/go-mod" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"

[permissions.cdo-workspace-write.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".git/**" = "read"
".agents" = "read"
".agents/**" = "read"
".codex" = "read"
".codex/**" = "read"

[permissions.cdo-workspace-write.network]
enabled = false

[permissions.cdo-read-only]
description = "Read minimal runtime files and the assigned workspace without writes."

[permissions.cdo-read-only.filesystem]
":minimal" = "read"
"/app/runner/node_modules/@openai/codex-linux-arm64" = "read"
"/usr/local/bin" = "read"
"/usr/local/go" = "read"
"/data/cache/go-mod" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"

[permissions.cdo-read-only.filesystem.":workspace_roots"]
"." = "read"
".git" = "read"
".git/**" = "read"
".agents" = "read"
".agents/**" = "read"
".codex" = "read"
".codex/**" = "read"

[permissions.cdo-read-only.network]
enabled = false
